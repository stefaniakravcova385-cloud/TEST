<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d50108;
  --btn-bg: #ffffff;
  --btn-text: #d50108;
  --text: #ffffff;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #d50108; } }
:root[data-theme="dark"] { --bg: #d50108; }
* { box-sizing: border-box; }
html, body {
  background: var(--bg) url(bg.jpg) center / cover no-repeat;
  background-attachment: fixed;
  color: var(--text);
  font-family: "Archivo", "Arial Black", Helvetica, Arial, sans-serif;
  font-stretch: 125%;
  font-weight: 800;
  overflow-x: hidden;
}
.page {
  --w: 100vw; --drop: 4%; --zoom: 1.04;
  position: fixed; inset: 0; width: 100%; height: 100%;
  min-height: 100vh; min-height: 100svh; min-height: 100dvh;
  background: var(--bg);
  overflow: hidden;
}
.page::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: url(first.jpg) center bottom / cover no-repeat;
  transform: translateY(var(--drop)) scale(var(--zoom)); transform-origin: 50% 100%;
}
.page.static::before { background-image: url(last.jpg); }
.page > video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center bottom;
  opacity: 0; pointer-events: none; z-index: 0;
  transform: translateY(var(--drop)) scale(var(--zoom)); transform-origin: 50% 100%;
}
.page.playing > video { opacity: 1; }
@media (min-aspect-ratio: 4/5) {
  .page {
    --w: min(100vw, calc((100svh - 48px) * 9 / 16));
    position: relative; inset: auto; width: var(--w); height: calc(100svh - 48px); min-height: 0;
    margin: 24px auto; border-radius: 28px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(60, 0, 0, .45);
  }
}
main {
  position: relative; z-index: 1; height: 100%; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: max(7svh, 36px) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  gap: 6svh;
}
@media (min-aspect-ratio: 4/5) { main { padding-top: 7%; gap: 5%; } }
.logo { display: flex; flex-direction: column; align-items: center; width: min(calc(var(--w) * .58), 300px); }
.bird { width: 23%; height: auto; margin-bottom: 5%; }
.word { width: 100%; display: flex; align-items: center; justify-content: center; gap: 3.2%; }
.word img { height: auto; display: block; }
.w1 { width: 43.8%; } .w2 { width: 53%; }
.bird, .word img { opacity: 0; animation: appear .55s ease-out forwards; }
.bird { animation-name: pop; animation-timing-function: cubic-bezier(.3,1.6,.5,1); animation-duration: .6s; animation-delay: .2s; }
.w1 { animation-delay: .2s; }
.w2 { animation-delay: .2s; }
/* ждём начала видео, чтобы логотип, текст и курица стартовали вместе */
.page:not(.playing):not(.static) .bird, .page:not(.playing):not(.static) .word img, .page:not(.playing):not(.static) .links { animation-play-state: paused; }
@keyframes appear { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
.links { width: min(calc(var(--w) * .72), 320px); margin-top: 0; display: flex; flex-direction: column; gap: clamp(10px, 2.5svh, 22px); opacity: 0; animation: fade .6s ease-out .2s forwards; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.note { margin: 0 0 6px; text-align: center; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; line-height: 1.3; font-weight: 700; font-stretch: 100%; text-shadow: 0 1px 8px rgba(120,0,0,.45); }
.note br { display: block; content: ""; margin-bottom: 6px; }
.logo, .links { flex-shrink: 0; }
a.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--btn-bg); color: var(--btn-text);
  text-decoration: none; text-transform: uppercase; letter-spacing: .5px;
  font: 800 16px Arial, sans-serif;
  padding: 17px 20px; border-radius: 999px;
  transition: transform .15s;
}
a.btn:active { transform: scale(.97); }
a.btn svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
a.btn--aligned {
  display: grid;
  grid-template-columns: 22px 110px;
  justify-content: center;
  text-align: left;
}

@media (prefers-reduced-motion: reduce) { .bird, .word img, .links { animation: none; opacity: 1; } }
</style>

<body>
<div class="page" id="page">
<video id="v" muted playsinline webkit-playsinline preload="auto" autoplay poster="first.jpg" aria-hidden="true" disablepictureinpicture><source src="video.mp4" type="video/mp4"></video>
<script>
(function () {
  var page = document.getElementById('page'), v = document.getElementById('v');
  var started = false;
  function mark() { if (!started) { started = true; page.classList.add('playing'); page.classList.remove('static'); } }
  function stat() { if (!started) page.classList.add('static'); }
  function running() { return !v.paused && v.currentTime > 0; }
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) { page.classList.add('static'); v.removeAttribute('autoplay'); v.pause(); return; }
  v.muted = true; v.defaultMuted = true;
  v.addEventListener('playing', mark);
  v.addEventListener('timeupdate', function () { if (running()) mark(); });
  v.addEventListener('error', stat);
  var p = v.play();
  if (p && p.catch) p.catch(stat);
  setTimeout(function () { if (running()) mark(); else stat(); }, 3000);
  /* если телефон запретил автозапуск (режим энергосбережения) — запускаем по первому касанию */
  document.addEventListener('touchstart', function () { if (!started) { var q = v.play(); if (q && q.catch) q.catch(function () {}); } }, { once: true, passive: true });
})();
</script>
